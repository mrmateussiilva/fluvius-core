name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-tests:
    name: API tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run migrations and API tests
        run: ./scripts/test-integration.sh

  web-build:
    name: Web build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  compose-config:
    name: Compose configuration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate development Compose
        run: docker compose config --quiet

      - name: Validate production Compose
        run: >-
          docker compose
          --env-file .env.production.example
          -f docker-compose.prod.yml
          config --quiet

      - name: Validate production Blue/Green Compose
        run: >-
          docker compose
          --env-file .env.production.example
          -f docker-compose.prod.slot.yml
          config --quiet

      - name: Validate deployment scripts
        run: |
          bash -n deploy/scripts/production-deploy.sh
          python -m compileall -q api/app
