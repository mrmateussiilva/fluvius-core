x-api-environment: &api-environment
  ENVIRONMENT: production
  HOME: /home/fluvius
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?configure POSTGRES_USER}:${POSTGRES_PASSWORD:?configure POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:?configure POSTGRES_DB}
  REDIS_URL: redis://:${REDIS_PASSWORD:?configure REDIS_PASSWORD}@redis:6379/0
  SECRET_KEY: ${SECRET_KEY:?configure SECRET_KEY}
  AUTH_COOKIE_SECURE: "true"
  LOGIN_RATE_LIMIT_ENABLED: "true"
  CORS_ORIGINS: https://${APP_DOMAIN:?configure APP_DOMAIN}
  PUBLIC_API_URL: https://${APP_DOMAIN:?configure APP_DOMAIN}
  LOCAL_STORAGE_PATH: /app/storage
  EVOLUTION_GO_BASE_URL: http://evolution-go:8080
  EVOLUTION_GO_WEBHOOK_BASE_URL: https://${APP_DOMAIN:?configure APP_DOMAIN}
  EVOLUTION_GO_API_KEY: ${EVOLUTION_GO_API_KEY:-}
  EVOLUTION_GO_GLOBAL_API_KEY: ${EVOLUTION_GO_GLOBAL_API_KEY:?configure EVOLUTION_GO_GLOBAL_API_KEY}
  EVOLUTION_GO_INSTANCE_TOKENS: '${EVOLUTION_GO_INSTANCE_TOKENS:-{}}'
  PROVIDER_CREDENTIALS_KEY: ${PROVIDER_CREDENTIALS_KEY:?configure PROVIDER_CREDENTIALS_KEY}
  WEBHOOK_SECRET: ${WEBHOOK_SECRET:?configure WEBHOOK_SECRET}

x-service-defaults: &service-defaults
  restart: unless-stopped
  init: true
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "5"

services:
  api:
    <<: *service-defaults
    image: fluvius-core-api-${FLUVIUS_SLOT:-blue}
    build: ./api
    user: "10001:10001"
    command:
      - sh
      - -c
      - >-
        uvicorn app.main:app --host 0.0.0.0 --port 8000
        --workers ${UVICORN_WORKERS:-4}
        --limit-concurrency ${UVICORN_LIMIT_CONCURRENCY:-200}
        --backlog ${UVICORN_BACKLOG:-2048}
        --timeout-keep-alive 5
        --proxy-headers --forwarded-allow-ips=*
    environment:
      <<: *api-environment
      UVICORN_WORKERS: ${UVICORN_WORKERS:-4}
      DEPLOYMENT_SLOT: ${FLUVIUS_SLOT:-blue}
    volumes:
      - ${FLUVIUS_DATA_DIR:-/srv/fluvius}/media:/app/storage
    ports:
      - "127.0.0.1:${FLUVIUS_SLOT_API_PORT:-18100}:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    mem_limit: 2048m
    cpus: 3
    pids_limit: 400
    networks:
      - frontend
      - backend

  worker:
    <<: *service-defaults
    image: fluvius-core-api-${FLUVIUS_SLOT:-blue}
    build: ./api
    user: "10001:10001"
    command:
      [
        "rq",
        "worker",
        "--url",
        "redis://:${REDIS_PASSWORD:?configure REDIS_PASSWORD}@redis:6379/0",
        "fluvius-maintenance",
      ]
    environment: *api-environment
    volumes:
      - ${FLUVIUS_DATA_DIR:-/srv/fluvius}/media:/app/storage
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from app.config import settings; from redis import Redis; c=Redis.from_url(settings.redis_url); assert c.ping(); c.close()",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
    mem_limit: 384m
    cpus: 0.75
    pids_limit: 200
    networks:
      - backend

  delivery-worker:
    <<: *service-defaults
    image: fluvius-core-api-${FLUVIUS_SLOT:-blue}
    build: ./api
    user: "10001:10001"
    command:
      [
        "rq",
        "worker-pool",
        "--url",
        "redis://:${REDIS_PASSWORD:?configure REDIS_PASSWORD}@redis:6379/0",
        "--num-workers",
        "${DELIVERY_WORKER_PROCESSES:-2}",
        "fluvius-delivery",
      ]
    environment: *api-environment
    volumes:
      - ${FLUVIUS_DATA_DIR:-/srv/fluvius}/media:/app/storage
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from app.config import settings; from redis import Redis; c=Redis.from_url(settings.redis_url); assert c.ping(); c.close()",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
    mem_limit: 768m
    cpus: 1
    pids_limit: 200
    networks:
      - backend

  webhook-worker:
    <<: *service-defaults
    image: fluvius-core-api-${FLUVIUS_SLOT:-blue}
    build: ./api
    user: "10001:10001"
    command:
      [
        "rq",
        "worker-pool",
        "--url",
        "redis://:${REDIS_PASSWORD:?configure REDIS_PASSWORD}@redis:6379/0",
        "--num-workers",
        "${WEBHOOK_WORKER_PROCESSES:-1}",
        "fluvius-webhooks",
      ]
    environment: *api-environment
    volumes:
      - ${FLUVIUS_DATA_DIR:-/srv/fluvius}/media:/app/storage
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from app.config import settings; from redis import Redis; c=Redis.from_url(settings.redis_url); assert c.ping(); c.close()",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
    mem_limit: 384m
    cpus: 0.75
    pids_limit: 200
    networks:
      - backend

  web:
    <<: *service-defaults
    image: fluvius-core-web-${FLUVIUS_SLOT:-blue}
    build:
      context: .
      dockerfile: web/Dockerfile.prod
    ports:
      - "127.0.0.1:${FLUVIUS_SLOT_WEB_PORT:-18180}:8080"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "/dev/null",
          "http://localhost:8080/",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 100
    networks:
      - frontend

networks:
  frontend:
    external: true
    name: ${FLUVIUS_FRONTEND_NETWORK:?configure FLUVIUS_FRONTEND_NETWORK}
  backend:
    external: true
    name: ${FLUVIUS_BACKEND_NETWORK:?configure FLUVIUS_BACKEND_NETWORK}
