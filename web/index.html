<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (() => {
        try {
          const stored = localStorage.getItem('fluvius_theme')
          const preference = ['light', 'dark', 'system'].includes(stored) ? stored : 'system'
          const theme =
            preference === 'system'
              ? window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
              : preference
          document.documentElement.classList.toggle('dark', theme === 'dark')
          document.documentElement.dataset.theme = theme
          document.documentElement.dataset.themePreference = preference
        } catch {
          // Keep the light theme when browser storage or media queries are unavailable.
        }
      })()
    </script>
    <title>Fluvius Core v0.0.37</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
